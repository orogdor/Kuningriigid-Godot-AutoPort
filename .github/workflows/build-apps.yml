name: Build Android APK, Windows EXE and auto-update content

# Release once per validated project major.minor (0.56, 0.57, ...), not every
# source commit. Manual workflow_dispatch / release-request.txt still force a
# hotfix release. Without a permanent Android signing key, publish the verified
# PCK and Windows assets only: never claim a new debug-signed APK is an update.
on:
  workflow_dispatch:
  # Automatically publish once after a new validated AutoPort version series
  # is merged (0.56 -> 0.57), NOT on every source change.
  workflow_run:
    workflows: ["Sync Three.js rules to Godot"]
    types: [completed]
  # A deliberate source-controlled release request is also permitted.
  # Normal commits and upstream syncs never build APK/EXE.
  push:
    branches: [main]
    paths:
      - '.github/release-request.txt'

permissions:
  contents: write

concurrency:
  # Serialise content releases, including automatic and manual requests.
  # Never allow an automatic run to supersede an explicit release request.
  group: autoport-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for genuinely new synced source
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            # Explicit manual launch or change to .github/release-request.txt.
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PARENT_EVENT="$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")"
          PARENT_CONCLUSION="$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
          PARENT_BRANCH="$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")"
          if [[ "$PARENT_CONCLUSION" != "success" || "$PARENT_BRANCH" != "main" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring failed or non-main validation."
            exit 0
          fi
          if [[ "$PARENT_EVENT" != "push" && "$PARENT_EVENT" != "schedule" && "$PARENT_EVENT" != "workflow_dispatch" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep the policy of not rebuilding APK/EXE for every source commit.
          # One validated release per project major.minor (plus manual hotfixes).
          PROJECT_VERSION="$(python3 tools/stamp_release.py --project game/project.godot --preset game/export_presets.cfg --run-number 1 --check-only)"
          PROJECT_SERIES="${PROJECT_VERSION%.*}"
          LAST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$LAST_TAG" == "v$PROJECT_SERIES."* ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "AutoPort $PROJECT_SERIES already released ($LAST_TAG)."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "First validated AutoPort $PROJECT_SERIES; last tag $LAST_TAG."
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve pinned Three.js rules revision
        id: source
        shell: bash
        run: |
          test -s game/data/generated/manifest.json
          test -s game/data/generated/city_buildings.json
          echo "sha=$(python3 -c 'import json; print(json.load(open("game/data/generated/manifest.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: orogdor/Kuningriigid
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download matching Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fL --retry 3 -o /tmp/godot-editor.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Configure Android SDK for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      # A newly generated debug key makes Android reject installs over the
      # previous APK. Never publish such APKs as update-compatible builds.
      # Until a persistent release key is configured, the existing Android APK
      # keeps receiving verified Content.pck updates.
      - name: Configure persistent Android signing key (optional)
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent Android signing secrets not configured. No APK will be published; use the verified Content.pck updater in existing installs."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoport-release.keystore"
          chmod 600 "$RUNNER_TEMP/autoport-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/autoport-release.keystore" \
            -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/autoport-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"


      # --editor --quit can exit while GLB scene imports are still queued.
      # Godot's --import mode explicitly waits for every import to finish.
      # Without it the release workflow can fail deep in detail_v21 with
      # "Preload file ...glb has no resource loaders", even though sync CI
      # and the same game code passed all parity checks.
      - name: Import active V299 GLB geometry from the pinned Three.js revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/import-web-v299.py --source upstream --out game/assets/web72 --commit "${{ steps.source.outputs.sha }}"
      - name: Rig latest TRELLIS geometry onto animated Godot source skeleton
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rig-trellis-v73.py --legacy game/assets/web53 --trellis game/assets/web72/unit --out game/assets/web73 --commit "${{ steps.source.outputs.sha }}"
      - name: Complete and verify every source GLB import before release tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --import
          while IFS= read -r -d '' source; do
            test -s "$source"
            model="$(basename "$source")"
            if ! find game/.godot/imported -maxdepth 1 -name "$model-*.scn" -size +0c -print -quit | grep -q .; then
              echo "::error::Incomplete Godot glTF import: $source"
              exit 1
            fi
          done < <(find game/assets/web50 game/assets/web53 game/assets/web72 game/assets/web73 -name '*.glb' -print0)

      - name: Compare 200 JavaScript city turns per scenario against native Godot
        shell: bash
        run: |
          set -euo pipefail
          cp game/data/generated/city_buildings.json /tmp/checked-city-definitions.json
          node tools/generate-city-v05-fixtures.mjs --source upstream \
            --definitions game/data/generated/city_buildings.json \
            --fixtures game/tests/city_v05_fixtures.json --commit "${{ steps.source.outputs.sha }}"
          cmp /tmp/checked-city-definitions.json game/data/generated/city_buildings.json
          node tools/generate-world-v06-fixtures.mjs --source upstream \
            --out game/tests/world_v06_fixtures.json --commit "${{ steps.source.outputs.sha }}"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_v05_parity.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_v05_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_v06_parity.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_v06_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_v07_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_camera_v19.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_placement_v20.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_rotation_v21.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/building_access_v22.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/path_grid_v23.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_growth_v24.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_districts_v25.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/district_transit_v26.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/continuous_city_v27.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/terrain_seams_v28.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/terrain_navigation_v29.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/district_visuals_v30.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_performance_v31.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_building_lod_v32.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_lod_stability_v33.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_ui_terrain_v34.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_screen_v34.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/research_v35.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/building_unlocks_v36.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/bronze_city_v37.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/capital_ai_v38.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/research_ai_v39.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/map_nav_v40.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_web_v41.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/seam_terrain_v42.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_seam_v43.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_preview_v44.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_buildings_v45.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_hybrid_v46.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/second_city_detail_v47.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/second_city_traffic_v48.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_trade_3d_v49.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/web_biomes_v50.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/web_art_v50.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/web_water_v51.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_v08_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/spatial_paths_v09.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_terrain_v10.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v11.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v12.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v13.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/freight_v14.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/logistics_v15.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/satellite_v16.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_trade_v17.gd

      - name: Import resources and inspect editor errors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 3

      - name: Verify synchronized GLB hit/strike clips for all 216 battlefield models
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/battle_sync_v70.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/battle_squad_v71.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/web_models_v72.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/trellis_rig_v73.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/spear_motion_v77.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/strategic_army_v78.gd
          timeout --signal=TERM --kill-after=5s 180s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/trellis_world_v74.gd

      - name: Stamp APK and GitHub Release with actual AutoPort version
        id: stamp
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 tools/stamp_release.py --project game/project.godot --preset game/export_presets.cfg --run-number ${{ github.run_number }})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION (Android versionCode ${{ github.run_number }})"

      - name: Build small native Windows launcher and structured game manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd launcher && go test ./... && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "$GITHUB_WORKSPACE/dist/Kuningriigid.exe" .)
          python3 tools/build-windows-manifest.py --source game --out dist/Windows-files.json --commit "$(git rev-parse HEAD)"
          curl -fL --retry 3 -o /tmp/godot-windows.zip             https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip
          mkdir -p /tmp/godot-windows
          unzip -q /tmp/godot-windows.zip -d /tmp/godot-windows
          cp /tmp/godot-windows/Godot_v4.4.1-stable_win64.exe dist/Kuningriigid-Engine.exe
          # The ORIGINAL Android 0.51 APK has a 24-second download timeout.
          # Keep its Content.pck small, then the bridge downloads the full game.
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-pack "Android" "$PWD/dist/Kuningriigid-Full-Content.pck"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path android-bridge --import
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path android-bridge --export-pack "Android" "$PWD/dist/Kuningriigid-Content.pck"
          test "$(stat -c%s dist/Kuningriigid-Content.pck)" -lt 1048576
          # Preserve a separate desktop PCK for manual Windows engine launches.
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-pack "Windows Desktop" "$PWD/dist/Kuningriigid-Windows-Content.pck"
          test -s dist/Kuningriigid.exe
          test -s dist/Kuningriigid-Engine.exe
          test -s dist/Windows-files.json
          test -s dist/Kuningriigid-Content.pck
          test -s dist/Kuningriigid-Full-Content.pck
          test -s dist/Kuningriigid-Windows-Content.pck

      - name: Smoke-test the legacy 0.51 APK -> tiny bridge -> full game
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-pack-smoke
          cp game/tests/android_pack_v58.gd /tmp/android-pack-smoke/android_pack_v58.gd
          cp game/tests/android_bridge_v76.gd /tmp/android-pack-smoke/android_bridge_v76.gd
          printf 'config_version=5\n[application]\nconfig/name="PCK Smoke Test"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/android-pack-smoke/project.godot
          # Check full game exports without falling back to checkout assets.
          for PACK in "$PWD/dist/Kuningriigid-Full-Content.pck" "$PWD/dist/Kuningriigid-Windows-Content.pck"; do
            ANDROID_CONTENT_PACK="$PACK" \
              ANDROID_RELEASE_VERSION="${{ steps.stamp.outputs.version }}" \
              timeout --signal=TERM --kill-after=5s 180s \
              /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
              --headless --path /tmp/android-pack-smoke --script res://android_pack_v58.gd
          done
          # Simulate the actual ORIGINAL 0.51 APK PCK, not an empty project.
          mkdir -p /tmp/legacy-android
          gh release download v0.51.738 \
            --repo orogdor/Kuningriigid-Godot-AutoPort \
            --pattern Kuningriigid-Content.pck --dir /tmp/legacy-android
          LEGACY_ANDROID_PCK="/tmp/legacy-android/Kuningriigid-Content.pck" \
            BRIDGE_ANDROID_PCK="$PWD/dist/Kuningriigid-Content.pck" \
            FULL_ANDROID_PCK="$PWD/dist/Kuningriigid-Full-Content.pck" \
            ANDROID_RELEASE_VERSION="${{ steps.stamp.outputs.version }}" \
            AUTOPORT_BRIDGE_SMOKE=1 \
            timeout --signal=TERM --kill-after=5s 180s \
            /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --headless --path /tmp/android-pack-smoke \
            --script res://android_bridge_v76.gd

      - name: Build signed Android ARM64 APK (only with persistent key)
        if: steps.android_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-release "Android" "$PWD/dist/Kuningriigid.apk"
          test -s dist/Kuningriigid.apk

      - name: Validate artifacts and document hashes
        shell: bash
        run: |
          (cd dist && sha256sum Kuningriigid.exe Kuningriigid-Engine.exe Windows-files.json Kuningriigid-Content.pck Kuningriigid-Full-Content.pck Kuningriigid-Windows-Content.pck > SHA256SUMS.txt)
          if [[ -f dist/Kuningriigid.apk ]]; then (cd dist && sha256sum Kuningriigid.apk >> SHA256SUMS.txt); fi
          cat dist/SHA256SUMS.txt
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-APK-EXE-PCK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable stable binaries and update pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v${{ steps.stamp.outputs.version }}"
          SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("game/data/generated/manifest.json"))["source_commit"])')"
          AUTOPORT_SHA="$(git rev-parse HEAD)"
          RELEASE_FILES=(dist/Kuningriigid.exe dist/Kuningriigid-Engine.exe dist/Windows-files.json dist/Kuningriigid-Content.pck dist/Kuningriigid-Full-Content.pck dist/Kuningriigid-Windows-Content.pck dist/SHA256SUMS.txt)
          ANDROID_NOTE="Existing Android installs update their game content via verified Content.pck; the APK itself is unchanged."
          if [[ -f dist/Kuningriigid.apk ]]; then
            RELEASE_FILES+=(dist/Kuningriigid.apk)
            ANDROID_NOTE="New APK signed with configured persistent keystore. Android in-place install additionally requires the same signing certificate as the currently installed APK."
          fi
          cat > /tmp/autoport-release-notes.txt <<EOF
          Source commit: $SOURCE_SHA
          AutoPort commit: $AUTOPORT_SHA

          Game version: $VERSION. Windows Kuningriigid.exe checks GitHub Releases and downloads only changed files, with SHA-256 verification and offline fallback.
          Android: $ANDROID_NOTE
          The original v0.51 Android APK has a 24-second download timeout. Kuningriigid-Content.pck is a tiny bridge that downloads Kuningriigid-Full-Content.pck with a 30-minute timeout and SHA-256 checks, then opens game_content.tscn. CI verifies upgrades starting with the actual v0.51 Android PCK. Manual Windows pack: Kuningriigid-Windows-Content.pck.
          The initial Android app keeps its own verified PCK updater. Your saves are not uninstalled or cleared.
          To install on a new Android device before a permanent signing key is configured, use the earlier bootstrap APK:
          https://github.com/orogdor/Kuningriigid-Godot-AutoPort/releases/tag/v0.51.738
          This is an actively developed Godot port; the newer Stone Age army and battle features are still a partial Three.js port.
          EOF
          gh release create "$VERSION" "${RELEASE_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kuningriigid Godot AutoPort $VERSION" \
            --notes-file /tmp/autoport-release-notes.txt \
            --latest