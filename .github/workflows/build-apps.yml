name: Build Android APK, Windows EXE and auto-update content

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Three.js rules to Godot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'launcher/**'
      - 'tools/build-windows-manifest.py'
      - '.github/workflows/build-apps.yml'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: autoport-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for genuinely new synced source
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PARENT_EVENT="$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")"
          PARENT_CONCLUSION="$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")"
          if [[ "$PARENT_CONCLUSION" != "success" || ( "$PARENT_EVENT" != "schedule" && "$PARENT_EVENT" != "workflow_dispatch" ) ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="$(python3 -c 'import json; print(json.load(open("game/data/generated/manifest.json"))["source_commit"])')"
          AUTOPORT_SHA="$(git rev-parse HEAD)"
          LAST_BODY="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
          if [[ -n "$SHA" && "$LAST_BODY" == *"Source commit: $SHA"* && "$LAST_BODY" == *"AutoPort commit: $AUTOPORT_SHA"* ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Source $SHA and AutoPort $AUTOPORT_SHA already released; no redundant binaries."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve pinned Three.js rules revision
        id: source
        shell: bash
        run: |
          test -s game/data/generated/manifest.json
          test -s game/data/generated/city_buildings.json
          echo "sha=$(python3 -c 'import json; print(json.load(open("game/data/generated/manifest.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: orogdor/Kuningriigid
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download matching Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fL --retry 3 -o /tmp/godot-editor.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Configure Android SDK for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/autoport-debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/autoport-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Compare 200 JavaScript city turns per scenario against native Godot
        shell: bash
        run: |
          set -euo pipefail
          cp game/data/generated/city_buildings.json /tmp/checked-city-definitions.json
          node tools/generate-city-v05-fixtures.mjs --source upstream \
            --definitions game/data/generated/city_buildings.json \
            --fixtures game/tests/city_v05_fixtures.json --commit "${{ steps.source.outputs.sha }}"
          cmp /tmp/checked-city-definitions.json game/data/generated/city_buildings.json
          node tools/generate-world-v06-fixtures.mjs --source upstream \
            --out game/tests/world_v06_fixtures.json --commit "${{ steps.source.outputs.sha }}"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_v05_parity.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/city_v05_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_v06_parity.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_v06_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_v07_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_camera_v19.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_v08_ui.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/spatial_paths_v09.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/detail_terrain_v10.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v11.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v12.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/construction_v13.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/freight_v14.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/logistics_v15.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/satellite_v16.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/world_trade_v17.gd

      - name: Import resources and inspect editor errors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 3

      - name: Build small native Windows launcher and structured game manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd launcher && go test ./... && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "$GITHUB_WORKSPACE/dist/Kuningriigid.exe" .)
          python3 tools/build-windows-manifest.py --source game --out dist/Windows-files.json --commit "$(git rev-parse HEAD)"
          curl -fL --retry 3 -o /tmp/godot-windows.zip             https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip
          mkdir -p /tmp/godot-windows
          unzip -q /tmp/godot-windows.zip -d /tmp/godot-windows
          cp /tmp/godot-windows/Godot_v4.4.1-stable_win64.exe dist/Kuningriigid-Engine.exe
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-pack "Windows Desktop" "$PWD/dist/Kuningriigid-Content.pck"
          test -s dist/Kuningriigid.exe
          test -s dist/Kuningriigid-Engine.exe
          test -s dist/Windows-files.json
          test -s dist/Kuningriigid-Content.pck

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-debug "Android" "$PWD/dist/Kuningriigid.apk"
          test -s dist/Kuningriigid.apk

      - name: Validate artifacts and document hashes
        shell: bash
        run: |
          (cd dist && sha256sum Kuningriigid.exe Kuningriigid-Engine.exe Windows-files.json Kuningriigid.apk Kuningriigid-Content.pck > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-APK-EXE-PCK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable stable binaries and update pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.19.${{ github.run_number }}"
          SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("game/data/generated/manifest.json"))["source_commit"])')"
          AUTOPORT_SHA="$(git rev-parse HEAD)"
          gh release create "$VERSION" \
            dist/Kuningriigid.exe dist/Kuningriigid-Engine.exe dist/Windows-files.json dist/Kuningriigid.apk dist/Kuningriigid-Content.pck dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kuningriigid Godot AutoPort $VERSION" \
            --notes "Source commit: $SOURCE_SHA. AutoPort commit: $AUTOPORT_SHA. Windows Kuningriigid.exe is a small launcher: it downloads GitHub-pinned files into Kuningriigid-Data/versions and a separate Godot runtime; later launches download only changed files and work offline. Android uses the original PCK updater. AutoPort 0.19 adds anchored two-finger zoom and pan in the Godot 3D detail camera, keeps one-finger orbit and tap-to-build safe, and retains 0.18 world-map pinch, 0.17 satellite AI and caravan ETA compatibility. 0.5 JS parity remains unchanged. This is a prototype without army AI or battles." \
            --latest
