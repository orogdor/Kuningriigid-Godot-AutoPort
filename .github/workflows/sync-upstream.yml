      - name: Save generated rules to AutoPort repository only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          # Several quick edits can land while CI is running; never force-push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/port.mjs --source ../upstream --out game/data/generated --commit "$UPSTREAM_SHA"
            python3 tools/import-web-units.py --source ../upstream --out game/assets/web53 --commit "$UPSTREAM_SHA"
            node tools/generate-city-v05-fixtures.mjs --source ../upstream \
              --definitions game/data/generated/city_buildings.json \
              --fixtures game/tests/city_v05_fixtures.json --commit "$UPSTREAM_SHA"
            git add game/data/generated/ game/assets/web53/
            if git diff --cached --quiet; then
              echo 'Rules already synced.'
              exit 0
            fi
            git commit -m "Sync Kuningriigid rules from Three.js main"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent change detected; retrying cleanly ($attempt/3)"
          done
          echo 'Could not save synced rules after 3 attempts'
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: kuningriigid-godot-rules
          path: port/game/data/generated/*.json
