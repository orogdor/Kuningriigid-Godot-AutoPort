name: Sync Three.js rules to Godot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'package.json'
      - 'tests/**'
      - 'game/scripts/**'
      - 'game/project.godot'
      - 'game/main.tscn'
      - '.github/workflows/**'
  schedule:
    - cron: '17 2,8,14,20 * * *' # Poll upstream 4 times daily

permissions:
  contents: write

concurrency:
  group: godot-port-sync
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: orogdor/Kuningriigid
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test static parser and reproducibility
        working-directory: port
        run: npm test
      - name: Export Godot JSON from exact Three.js source revision
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/port.mjs --source ../upstream --out game/data/generated --commit "$UPSTREAM_SHA"
      - name: Verify full static rule parity against upstream
        working-directory: port
        run: npm run parity -- --source ../upstream --out game/data/generated
      - name: Generate JS reference results for six actual gameplay formulas
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/generate-logic-fixtures.mjs --source ../upstream --out game/tests/logic_parity_cases.json --commit "$UPSTREAM_SHA"
      - name: Validate Godot 4 import and headless launch
        working-directory: port
        shell: bash
        run: |
          test -f game/project.godot
          curl -fLsS --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 3
      - name: Verify upstream JavaScript gameplay matches native Godot
        working-directory: port
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/logic_parity.gd
      - name: Save generated rules to AutoPort repository only
        working-directory: port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          # Several quick edits can land while CI is running; never force-push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/port.mjs --source ../upstream --out game/data/generated --commit "$UPSTREAM_SHA"
            git add game/data/generated/
            if git diff --cached --quiet; then
              echo 'Rules already synced.'
              exit 0
            fi
            git commit -m "Sync Kuningriigid rules from Three.js main"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent change detected; retrying cleanly ($attempt/3)"
          done
          echo 'Could not save synced rules after 3 attempts'
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: kuningriigid-godot-rules
          path: port/game/data/generated/*.json
