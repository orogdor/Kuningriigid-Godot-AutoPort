name: Sync Three.js rules to Godot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'package.json'
      - 'tests/**'
      - 'game/scripts/**'
      - 'game/tests/**' # Regression fixture edits must run checks, without APK/EXE.
      - 'game/project.godot'
      - 'game/main.tscn'
      - '.github/workflows/sync-upstream.yml'
  schedule:
    - cron: '17 2,8,14,20 * * *' # Poll upstream 4 times daily

permissions:
  contents: write

concurrency:
  group: godot-port-sync-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: orogdor/Kuningriigid
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app release versions against Godot project
        working-directory: port
        shell: bash
        run: |
          python3 tools/test_stamp_release.py
          python3 tools/stamp_release.py --project game/project.godot --preset game/export_presets.cfg --run-number 900 --check-only
      - name: Check individual soldiers and campaign encounter rules against Three.js
        working-directory: port
        run: node tools/verify-individual-v56.mjs --source ../upstream
      - name: Check first tactical battlefield geometry against Three.js
        working-directory: port
        run: node tools/verify-battle-v55.mjs --source ../upstream
      - name: Check Stone Age military values against exact upstream sources
        working-directory: port
        run: node tools/verify-military-v54.mjs --source ../upstream
      - name: Test static parser and reproducibility
        working-directory: port
        run: npm test
      - name: Export Godot JSON from exact Three.js source revision
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/port.mjs --source ../upstream --out game/data/generated --commit "$UPSTREAM_SHA"
      - name: Verify full static rule parity against upstream
        working-directory: port
        run: npm run parity -- --source ../upstream --out game/data/generated
      - name: Generate JS reference results for six actual gameplay formulas
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/generate-logic-fixtures.mjs --source ../upstream --out game/tests/logic_parity_cases.json --commit "$UPSTREAM_SHA"
      - name: Generate upstream-backed city recipes and 6 x 200-turn reference simulation
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/generate-city-v05-fixtures.mjs --source ../upstream \
            --definitions game/data/generated/city_buildings.json \
            --fixtures game/tests/city_v05_fixtures.json --commit "$UPSTREAM_SHA"
      - name: Generate original JavaScript world layout parity fixtures
        working-directory: port
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          node tools/generate-world-v06-fixtures.mjs --source ../upstream \
            --out game/tests/world_v06_fixtures.json --commit "$UPSTREAM_SHA"
      - name: Import original Three.js stone-age GLB models
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          python3 tools/import-web-units.py --source ../upstream --out game/assets/web53 --commit "$UPSTREAM_SHA"
      - name: Import V299 active world, nature, building and TRELLIS meshes
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          python3 tools/import-web-v299.py --source ../upstream --out game/assets/web72 --commit "$UPSTREAM_SHA"
      - name: Rig V262 TRELLIS meshes to V148 skeleton and animations
        working-directory: port
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C ../upstream rev-parse HEAD)"
          python3 tools/rig-trellis-v73.py --legacy game/assets/web53 --trellis game/assets/web72/unit --out game/assets/web73 --commit "$UPSTREAM_SHA"
      - name: Validate Godot 4 import and headless launch
        working-directory: port
        shell: bash
        run: |
          test -f game/project.godot
          curl -fLsS --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --import
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 3
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path android-bridge --editor --quit
      - name: Check real GLB soldier pixels using Mesa renderer
        working-directory: port
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb xauth; fi
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=TERM --kill-after=5s 180s \
            xvfb-run -a /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
              --path game --rendering-method gl_compatibility \
              --script res://tests/soldier_pixels_v75.gd
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=TERM --kill-after=5s 240s \
            xvfb-run -a /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
              --path game --rendering-method gl_compatibility \
              --script res://tests/soldier_game_screen_v75.gd
      - name: Save soldier pixel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-pixels-v75
          path: port/game/test-output/soldier-*.png
          if-no-files-found: ignore
      - name: Verify upstream JavaScript gameplay matches native Godot
        working-directory: port
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/logic_parity.gd
      - name: Verify 200 turns of real upstream economy.js against Godot 0.5
        working-directory: port
        run: |
          timeout --signal=TERM --kill-after=5s 30s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/scout_parse_v52.gd
