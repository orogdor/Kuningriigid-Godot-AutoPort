name: Verify actual soldier pixels
on:
  pull_request:
    paths:
      - 'game/scripts/web_units_v53.gd'
      - 'game/tests/rendered_warriors_v76.gd'
      - 'tools/rig-trellis-v73.py'
      - '.github/workflows/warrior-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orogdor/Kuningriigid
          path: upstream
      - name: Prepare OpenGL software rendering and Godot
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1
          mkdir -p /tmp/godot
          curl -fLsS --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Import the exact legacy and TRELLIS assets
        run: |
          set -euo pipefail
          sha="$(git -C upstream rev-parse HEAD)"
          python3 tools/import-web-units.py --source upstream --out game/assets/web53 --commit "$sha"
          python3 tools/import-web-v299.py --source upstream --out game/assets/web72 --commit "$sha"
          python3 tools/rig-trellis-v73.py --legacy game/assets/web53 --trellis game/assets/web72/unit --out game/assets/web73 --commit "$sha"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --import
      - name: Render and inspect warrior pixels (not just scene nodes)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 150s \
            xvfb-run -a -s '-screen 0 1024x768x24' \
            /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --path game --rendering-driver opengl3 \
            --script res://tests/rendered_warriors_v76.gd
      - name: Upload rendered diagnostic images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warrior-visuals-v76
          path: warrior-visuals-v76/
          if-no-files-found: ignore
